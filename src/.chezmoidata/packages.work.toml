# Work-only packages

[packages.darwin.work]

taps = [
    "alesbrelih/gitlab-ci-ls", # GitLab CI Language Server
    "hashicorp/tap",           # Vault (dropped from homebrew-core after the BUSL relicense)
]

cli = [
    # API & Protobuf
    "buf",                  # Protobuf tooling
    "protobuf",             # Protocol Buffers
    "protoc-gen-go",        # Go protobuf codegen
    "protoc-gen-go-grpc",   # Go gRPC codegen
    "newman",               # Postman CLI runner
    "go-task",              # Task runner (Makefile alternative)

    # Java
    "openjdk",              # Java Development Kit

    # Infrastructure
    "derailed/k9s/k9s",    # Kubernetes CLI
    "kaskade",              # Kafka TUI
    "openfortivpn",         # FortiVPN client
    "hashicorp/tap/vault",  # Secrets manager

    # GitLab
    "glab",                 # GitLab CLI — config in dot_config/glab-cli, token from Keychain

    # LSP / Editor
    "alesbrelih/gitlab-ci-ls/gitlab-ci-ls", # GitLab CI Language Server

    # Misc
    "slackdump",            # Slack export tool
    "node@22",              # Node.js 22 LTS
    "k6",                   # Load-testing CLI
]

casks = [
    # Communication
    "zoom",                 # Video Conferencing
    "slack",                # Team Messenger
    "postman",              # API Testing
]
