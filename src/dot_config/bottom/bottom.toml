# bottom 0.14.3
# bottom (btm) configuration
# https://clementtsang.github.io/bottom/
#
# Usage:
#   btm              # launch (or `top` alias)
#   btm --help       # all flags
#   btm -b           # basic mode
#
# NOTE: the flat [flags] table was split into sectioned tables in 0.13+.
# The new schema is documented (commented) below. Activated keys are uncommented.
# btm tolerates unknown/ill-typed keys quietly, so verify any newly-enabled option
# by launching btm once.

# ── General ──────────────────────────────────────────────────────────

# Scroll bar on table widgets (0.13+)
show_table_scroll_bar = true

# table_gap = 1                  # rows of gap between table header and data (0.13+)
# rate = "1s"                    # data update rate
# retention = "10m"
# default_time_value = "60s"
# time_delta = "15s"
# basic = false                  # htop-like, no graphs
# expanded = false
# dot_marker = false
# disable_click = false
# hide_time = false
# autohide_time = false
# default_widget_type = "proc"
# default_widget_count = 1
# battery = false
# disable_gpu = false
# Pre-defined theme (overrides [styles]): default, gruvbox, nord (+ -light)
# theme = "default"

# ── CPU ──────────────────────────────────────────────────────────────
# [cpu]
# hide_avg_cpu = false
# default = "all"                # "all" or "average"  (was default_cpu_entry)
# left_legend = false            # (was cpu_left_legend)

# ── Processes ────────────────────────────────────────────────────────
# [processes]
# default_grouped = false        # (was group_processes)
# case_sensitive = false
# whole_word = false
# regex = false
# default_tree = false           # (was tree)
# process_command = false
# default_memory_value = false   # percentage vs value (was process_memory_as_value)
# get_threads = false
# disable_advanced_kill = false
# hide_k_threads = false
default_sort = "cpu%"            # default sort column (0.14.7+: honored from config)
# columns = []                   # customize process table columns

# ── Memory ───────────────────────────────────────────────────────────
# [memory]
# enable_cache_memory = false
# memory_legend = "top-right"

# ── Network ──────────────────────────────────────────────────────────
# [network]
# network_use_bytes = false
# network_use_binary_prefix = false
# network_use_log = false
# network_legend = "top-right"

# ── Temperature ──────────────────────────────────────────────────────
# [temperature]
# temperature_type = "celsius"   # celsius, fahrenheit, kelvin

# ── Disk ─────────────────────────────────────────────────────────────
# [disk]
default_sort = "name"

# ── Styles (One Dark Pro) ────────────────────────────────────────────

[styles]
[styles.cpu]
all_entry_color = "#61afef"
avg_entry_color = "#e06c75"

[styles.memory]
ram_color = "#98c379"
cache_color = "#c678dd"
swap_color = "#d19a66"
arc_color = "#56b6c2"
gpu_colors = ["#c678dd", "#e06c75", "#d19a66", "#98c379", "#56b6c2"]

[styles.network]
rx_color = "#98c379"
tx_color = "#e06c75"
rx_total_color = "#98c379"
tx_total_color = "#e06c75"

[styles.battery]
high_battery_color = "#98c379"
medium_battery_color = "#e5c07b"
low_battery_color = "#e06c75"

[styles.tables]
headers = { color = "#c678dd", bold = true }

[styles.graphs]
graph_color = "#636d83"
legend_text = { color = "#abb2bf" }

[styles.widgets]
border_color = "#636d83"
selected_border_color = "#61afef"
widget_title = { color = "#abb2bf" }
text = { color = "#abb2bf" }
selected_text = { color = "#282c34", bg_color = "#61afef" }
disabled_text = { color = "#5c6370" }
